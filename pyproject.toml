[project]
name = "hyde-rag"
version = "0.1.0"
description = "When does HyDE help? A RAG system and benchmark: BEIR reproduction plus food-safety domain adaptation."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sudhanshu Tiwari" }]
requires-python = ">=3.11"
# Versions verified on PyPI 2026-10-14 (see docs/DECISIONS.md, D-ENV-*).
# numpy/scipy are held at the last releases that still support Python 3.11.
dependencies = [
    "anthropic==1.13.0",
    "openai==3.31.0",
    "bm25s==0.3.13",
    "PyStemmer==3.1.0",
    "pytrec-eval-terrier==0.5.10",
    "sentence-transformers==6.1.0",
    "transformers==5.19.0",
    "torch==2.14.1",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "tqdm==4.70.1",
    "pdfplumber==0.11.10",
    "certifi==2026.7.22",
]

[project.optional-dependencies]
api = ["fastapi==0.143.0", "uvicorn==0.54.0"]
demo = ["streamlit==1.65.0"]
train = ["datasets==5.1.0", "accelerate==1.15.0"]
dev = ["ruff==0.17.0", "pytest==9.1.1"]

[project.scripts]
hyde-rag = "hyde_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hyde_rag"]

# CPU-only PyTorch everywhere (keeps Linux CI from pulling CUDA wheels).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
