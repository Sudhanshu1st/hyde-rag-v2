name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU-only torch, no API keys needed)
        run: uv sync --extra dev --extra api
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests, including end-to-end smoke evals on fixtures with cached generations
        run: uv run pytest
