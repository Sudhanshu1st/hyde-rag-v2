# Food-safety quality corpus: public sources only.
# STATUS: DRAFT (Phase 1). URLs and licences were verified 2026-10-14 by fetching each
# publisher's own pages. `retrieved` and `sha256` are filled in by
# scripts/download_food_corpus.py in Phase 4.
#
# Commit rule:
#   commit_raw: true   -> US federal government work (17 U.S.C. 105) or CC0, with no
#                          third-party copyright/permission notice found in the document.
#   commit_raw: false  -> download script only; the raw file is never committed.
#
# Licence policies (publisher pages):
#   FDA:     https://www.fda.gov/about-fda/about-website/website-policies
#            ("Unless otherwise noted ... public domain"; record date copied and link back)
#   openFDA: https://open.fda.gov/license/  (CC0 1.0 unless noted)
#   USDA:    https://www.usda.gov/about-usda/policies-and-links  (most content public domain;
#            some material "used by USDA with permission")
#   FSSAI:   https://fssai.gov.in/website-policies  (reproduction with acknowledgement; not US PD)
#   Codex:   PDF imprint "(c) FAO and WHO, 2023. Some rights reserved ... CC BY-NC-SA 3.0 IGO"
#
# Download etiquette (observed 2026-10-14):
#   fda.gov: robots.txt Crawl-Delay 30, plus bot detection. Single thread, >= 30 s between
#            requests, back off on errors, never evade.
#   usda.gov / fsis.usda.gov: 403 to scripted clients from the dev network. The script
#            supports a manual-download fallback, with sha256 verification against this file.
#   openknowledge.fao.org: Crawl-delay 10.
#   api.fda.gov: 1,000 requests/day without a key (plenty for 4 queries).

defaults:
  fda_media: https://www.fda.gov/media/{id}/download
  fda_wl: https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/warning-letters/{slug}
  usda_guidance: https://www.usda.gov/sites/default/files/guidance-documents/FSIS.%20{name}
  fsis_media: https://www.fsis.usda.gov/sites/default/files/media_file/{path}
  openfda_enforcement: https://api.fda.gov/food/enforcement.json

