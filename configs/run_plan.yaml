# Planned bulk LLM runs, used by scripts/estimate_cost.py for the up-front budget.
# These are PLANNING estimates. Before any real run, the cost guard recomputes the
# input side exactly with the count_tokens API and the output side from a 20-call
# pilot (which also measures thinking tokens), and stops if the run is over the limit.

# Conservative chars-per-token for English with Claude's current tokenizers.
chars_per_token: 3.2

# Model roles. Override on the command line, e.g. --role answerer=claude-opus-5-5
roles:
  hyde_bulk: claude-haiku-5-5         # headline HyDE / multi-query generator (cheap, thinking off)
  hyde_top: claude-opus-5-5           # "top Claude model" arm of the generator ablation
  hyde_open: open-weights             # open-weights arm (Groq / Ollama / Kaggle vLLM): $0 API cost
  answerer: claude-sonnet-5-5         # RAG answer generation with citations
  judge: claude-opus-5-5              # claim-level faithfulness + citation + correctness judge
  question_gen: claude-opus-5-5       # food eval-set candidate questions (must differ from hyde_bulk)
  synthetic_gen: claude-haiku-5-5     # F2 fine-tuning queries (must differ from question_gen)

# Mean output tokens per call (visible text + thinking). Pilot runs replace these.
# Opus 5.5 cannot disable thinking; at effort=low we budget ~80 thinking tokens on top.
output_tokens:
  hyde_passage:
    claude-haiku-5-5: 250
    claude-opus-5-5: 330
    open-weights: 250
  multi_query_k4:
    claude-haiku-5-5: 120
    claude-opus-5-5: 200
    open-weights: 120

runs:
  # ---------------- Phase 2: BEIR retrieval ----------------
  - {id: hyde_scifact_bulk,   phase: 2, role: hyde_bulk, dataset: scifact,    split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: hyde_scifact_top,    phase: 2, role: hyde_top,  dataset: scifact,    split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: hyde_scifact_open,   phase: 2, role: hyde_open, dataset: scifact,    split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: hyde_covid_bulk,     phase: 2, role: hyde_bulk, dataset: trec-covid, split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: hyde_covid_top,      phase: 2, role: hyde_top,  dataset: trec-covid, split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: hyde_covid_open,     phase: 2, role: hyde_open, dataset: trec-covid, split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: hyde_arguana_bulk,   phase: 2, role: hyde_bulk, dataset: arguana,    split: test,  samples: 8, prompt_overhead: 35, output: hyde_passage}
  - {id: mq_scifact_bulk,     phase: 2, role: hyde_bulk, dataset: scifact,    split: test,  samples: 1, prompt_overhead: 80, output: multi_query_k4}
  - {id: mq_scifact_top,      phase: 2, role: hyde_top,  dataset: scifact,    split: test,  samples: 1, prompt_overhead: 80, output: multi_query_k4}
  - {id: mq_covid_bulk,       phase: 2, role: hyde_bulk, dataset: trec-covid, split: test,  samples: 1, prompt_overhead: 80, output: multi_query_k4}
  - {id: mq_covid_top,        phase: 2, role: hyde_top,  dataset: trec-covid, split: test,  samples: 1, prompt_overhead: 80, output: multi_query_k4}

  # ---------------- Phase 3: generation on SciFact (100-query sample) ----------------
  # HyDE docs for a 200-query dev sample from the SciFact train split (tau calibration).
  - {id: hyde_scifact_dev,    phase: 3, role: hyde_bulk, dataset: scifact,    split: train, samples: 8, prompt_overhead: 35, output: hyde_passage, max_queries: 200}
  # 4 retrieval systems x 100 claims; top-5 abstracts (~470 tok each) + instructions.
  - {id: answers_scifact,     phase: 3, role: answerer, n_calls: 400,  input_tokens: 3000, output_tokens: 450}
  - {id: judge_scifact,       phase: 3, role: judge,    n_calls: 400,  input_tokens: 2800, output_tokens: 600}

  # ---------------- Phase 4: food corpus + eval set ----------------
  # ~130 chunk samples x 3 questions each (~390 candidates for ~250 after review) + unanswerables.
  - {id: food_question_gen,   phase: 4, role: question_gen, n_calls: 150, input_tokens: 1800, output_tokens: 800}

  # ---------------- Phase 5: domain adaptation + final food benchmark ----------------
  # ~4,000 chunks x 1 call (3 queries each) for embedder fine-tuning.
  - {id: food_synthetic_q,    phase: 5, role: synthetic_gen, n_calls: 4000, input_tokens: 650, output_tokens: 160}
  # ~280 questions x 8 samples x {paper-generic, domain F1} instruction.
  - {id: hyde_food_bulk,      phase: 5, role: hyde_bulk, n_calls: 4480, input_tokens: 70, output_tokens: 250}
  - {id: hyde_food_top,       phase: 5, role: hyde_top,  n_calls: 1600, input_tokens: 70, output_tokens: 330}
  - {id: hyde_food_open,      phase: 5, role: hyde_open, n_calls: 2240, input_tokens: 70, output_tokens: 250}
  - {id: mq_food_bulk,        phase: 5, role: hyde_bulk, n_calls: 280,  input_tokens: 110, output_tokens: 120}
  # 4 configs x ~200 test questions for generation metrics.
  - {id: answers_food,        phase: 5, role: answerer, n_calls: 800,  input_tokens: 2600, output_tokens: 450}
  - {id: judge_food,          phase: 5, role: judge,    n_calls: 800,  input_tokens: 2600, output_tokens: 650}

# Pilots, retries and reruns.
contingency: 0.15
