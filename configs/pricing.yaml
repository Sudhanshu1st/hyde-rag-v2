# USD per million tokens. Source: https://platform.claude.com/docs/en/about-claude/pricing
# Verified: 2026-10-14. Batch API = 50% of standard on input and output.
# Thinking tokens are billed as output tokens.
# Re-verify before publishing results; cost numbers in results/ are computed from this file.
source: https://platform.claude.com/docs/en/about-claude/pricing
verified: "2026-10-14"
batch_discount: 0.5

models:
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.10
  claude-haiku-5-5:
    # Tier for prompts <= 100K tokens (every request in this project is far below that).
    input: 0.10
    output: 0.50
    cache_read: 0.01
  claude-fable-5-1:
    input: 10.00
    output: 50.00
    cache_read: 0.25
  # Open-weights models are priced at 0 here (self-hosted / free tier);
  # the latency column is the honest cost signal for them.
  open-weights:
    input: 0.0
    output: 0.0
    cache_read: 0.0
