# Planned LLM work, expressed in free-tier quota (tokens and requests), not money.
# scripts/estimate_quota.py turns this into days of free quota per model (docs/QUOTA_PLAN.md).
#
# Profiles:
#   core - the smallest plan that still answers "when does HyDE help": N in {1, 4},
#          generator ablation, multi-query, both BEIR datasets, generation + food evals.
#   full - adds the paper's N=8 and the larger ablations (about twice the quota).
# Run `scripts/estimate_quota.py --profile core` (default) or `--profile full`.

# Tokens per call (prompt + completion incl. reasoning).
# Measured: 20-call pilots on SciFact, 2026-10-14. Others are planning assumptions.
tokens_per_call:
  hyde_passage:   {openai/gpt-oss-120b: 496, openai/gpt-oss-20b: 726, qwen/qwen3.8-27b: 310}  # measured
  multi_query_k4: {openai/gpt-oss-120b: 208, openai/gpt-oss-20b: 260, qwen/qwen3.8-27b: 180}  # 120b measured
  answer_top3:    {openai/gpt-oss-120b: 2100, openai/gpt-oss-20b: 2300, qwen/qwen3.8-27b: 2000}
  judge_claims:   {openai/gpt-oss-120b: 1900, openai/gpt-oss-20b: 2100, qwen/qwen3.8-27b: 1800}
  question_gen:   {openai/gpt-oss-120b: 2700, openai/gpt-oss-20b: 2900, qwen/qwen3.8-27b: 2600}

runs:
  # ---------------- Phase 2: BEIR retrieval ----------------
  - {id: hyde_scifact_main_n4,  profile: core, phase: 2, role: hyde_main,  task: hyde_passage,   queries: 300, samples: 4}
  - {id: hyde_scifact_main_n8,  profile: full, phase: 2, role: hyde_main,  task: hyde_passage,   queries: 300, samples: 4}  # samples 5-8
  - {id: mq_scifact,            profile: core, phase: 2, role: hyde_main,  task: multi_query_k4, queries: 300, samples: 1}
  - {id: hyde_covid_main_n4,    profile: core, phase: 2, role: hyde_main,  task: hyde_passage,   queries: 50,  samples: 4}
  - {id: hyde_covid_main_n8,    profile: full, phase: 2, role: hyde_main,  task: hyde_passage,   queries: 50,  samples: 4}  # samples 5-8
  - {id: mq_covid,              profile: core, phase: 2, role: hyde_main,  task: multi_query_k4, queries: 50,  samples: 1}
  - {id: hyde_scifact_alt_n4,   profile: core, phase: 2, role: hyde_alt,   task: hyde_passage,   queries: 300, samples: 4}
  - {id: hyde_covid_alt_n4,     profile: core, phase: 2, role: hyde_alt,   task: hyde_passage,   queries: 50,  samples: 4}
  - {id: hyde_covid_small_n1,   profile: core, phase: 2, role: hyde_small, task: hyde_passage,   queries: 50,  samples: 1}
  - {id: hyde_scifact_small_n1, profile: core, phase: 2, role: hyde_small, task: hyde_passage,   queries: 300, samples: 1}
  - {id: hyde_scifact_small_n4, profile: full, phase: 2, role: hyde_small, task: hyde_passage,   queries: 300, samples: 3}  # samples 2-4

  # ---------------- Phase 3: generation on SciFact (100 claims x 2 systems) ----------------
  - {id: answers_scifact,       profile: core, phase: 3, role: answerer,   task: answer_top3,  calls: 200}
  - {id: judge_scifact,         profile: core, phase: 3, role: judge,      task: judge_claims, calls: 200}

  # ---------------- Phase 4: food eval set ----------------
  - {id: food_question_gen,     profile: core, phase: 4, role: question_gen, task: question_gen, calls: 120}

  # ---------------- Phase 5: domain adaptation + final food benchmark ----------------
  # ~200 questions x N=4 x {paper-generic, domain} instruction.
  - {id: hyde_food_main,        profile: core, phase: 5, role: hyde_main,  task: hyde_passage,   calls: 1600}
  - {id: mq_food,               profile: core, phase: 5, role: hyde_main,  task: multi_query_k4, calls: 200}
  - {id: answers_food,          profile: core, phase: 5, role: answerer,   task: answer_top3,    calls: 280}
  - {id: judge_food,            profile: core, phase: 5, role: judge,      task: judge_claims,   calls: 280}
