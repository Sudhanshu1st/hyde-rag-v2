# TREC-COVID (BEIR test, 50 queries, 171,332 docs): HyDE's largest gain over its dense
# baseline in the paper (27.3 -> 59.3), but BM25 is just as strong (59.5). The question here:
# does hybrid search make HyDE redundant?
# rcap@100 is BEIR's capped recall, which the paper reports for TREC-COVID (D-EVAL-2).
name: trec-covid
dataset: trec-covid
split: test
depth: 1000
metrics: [ndcg@10, recall@10, recall@100, rcap@100, mrr@10]

baselines:
  contriever: dense-contriever
  bge-base: dense-bge

systems:
  - {name: bm25, type: bm25, baseline: dense-contriever}
  - {name: dense-contriever, type: dense, encoder: contriever}
  - {name: dense-bge, type: dense, encoder: bge-base}

  - {name: hyde-contriever-120b-n1, type: hyde, encoder: contriever, generator: openai/gpt-oss-120b, instruction: paper.trec-covid, n: 1}
  - {name: hyde-contriever-120b-n4, type: hyde, encoder: contriever, generator: openai/gpt-oss-120b, instruction: paper.trec-covid, n: 4}
  - {name: hyde-contriever-120b-n8, type: hyde, encoder: contriever, generator: openai/gpt-oss-120b, instruction: paper.trec-covid, n: 8}
  - {name: hyde-bge-120b-n8, type: hyde, encoder: bge-base, generator: openai/gpt-oss-120b, instruction: paper.trec-covid, n: 8}
  - {name: hyde-contriever-20b-n8, type: hyde, encoder: contriever, generator: openai/gpt-oss-20b, instruction: paper.trec-covid, n: 8}
  - {name: hyde-contriever-qwen-n8, type: hyde, encoder: contriever, generator: qwen/qwen3.8-27b, instruction: paper.trec-covid, n: 8}

  - {name: hybrid-contriever, type: rrf, inputs: [bm25, dense-contriever], baseline: dense-contriever}
  - {name: hybrid-bge, type: rrf, inputs: [bm25, dense-bge], baseline: dense-bge}
  - {name: hybrid-hyde-contriever, type: rrf, inputs: [bm25, hyde-contriever-120b-n8], baseline: dense-contriever}
  - {name: hybrid-hyde-bge, type: rrf, inputs: [bm25, hyde-bge-120b-n8], baseline: dense-bge}
  - {name: bm25-q2d, type: bm25_q2d, generator: openai/gpt-oss-120b, instruction: paper.trec-covid, n: 8, baseline: dense-contriever}

  - {name: mq-bm25, type: multi_query, generator: openai/gpt-oss-120b, legs: [bm25], baseline: dense-contriever}
  - {name: mq-hybrid-bge, type: multi_query, generator: openai/gpt-oss-120b, legs: [bm25, "dense:bge-base"], baseline: dense-bge}

  - {name: rerank-bm25, type: rerank, input: bm25, depth: 100, baseline: dense-contriever}
  - {name: rerank-dense-bge, type: rerank, input: dense-bge, depth: 100, baseline: dense-bge}
  - {name: rerank-hybrid-bge, type: rerank, input: hybrid-bge, depth: 100, baseline: dense-bge}
  - {name: rerank-hyde-contriever-120b-n8, type: rerank, input: hyde-contriever-120b-n8, depth: 100, baseline: dense-contriever}
  - {name: rerank-hybrid-hyde-bge, type: rerank, input: hybrid-hyde-bge, depth: 100, baseline: dense-bge}
